name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (ESLint)
        run: npm run lint

      - name: Comprobar tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Verificar migraciones SQL
        run: npm run db:check
