<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva tarea</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 24px 16px; }
    form { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 10px;
           box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input, select { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #c3c8d0;
                    border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #mensaje { margin-top: 16px; min-height: 1.2em; }
    .ok { color: #15803d; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <form id="formulario">
    <h1>Nueva tarea</h1>

    <label for="titulo">Título</label>
    <input type="text" id="titulo" name="titulo" required maxlength="200">

    <label for="prioridad">Prioridad</label>
    <select id="prioridad" name="prioridad">
      <option value="Alta">Alta</option>
      <option value="Media">Media</option>
      <option value="Baja">Baja</option>
    </select>

    <button type="submit" id="enviar">Enviar</button>
    <div id="mensaje" role="status"></div>
  </form>

  <script src="app.js"></script>
</body>
</html>
